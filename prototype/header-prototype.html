<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Not production code. Delete or absorb after a variant wins.
  Question: what should the one Vue header (built at the CHM Flip) look like, and does
  a [data-realm] CSS-token model cover all three clearing-house themes + dark mode?
  Run: open prototype/header-prototype.html   (variants: ?variant=A|B|C, ← → keys)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header prototype — clearing-house token model</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.19/dist/vue.global.prod.js"></script>
<style>
/* ============================================================
   THE TOKEN SEAM — a theme is one block, no overrides elsewhere
   ============================================================ */
:root {
  --ch-primary: #007b3a;
  --ch-primary-rgb: 0, 123, 58;
  --ch-primary-dark: #005c2b;
  --ch-header-fg: #ffffff;
  --ch-surface: #ffffff;
  --ch-surface-muted: #f6f5f2;
  --ch-ink: #1c1f23;
  --ch-accent: #ffc107;
}
[data-realm="abs"] {
  --ch-primary: #564c4d;
  --ch-primary-rgb: 86, 76, 77;
  --ch-primary-dark: #3f3738;
  --ch-accent: #8bc34a;
}
[data-realm="bch"] {
  --ch-primary: #a05800;
  --ch-primary-rgb: 160, 88, 0;
  --ch-primary-dark: #7c4400;
  --ch-accent: #ffd54f;
}
[data-realm="chm"] {
  --ch-primary: #007b3a;
  --ch-primary-rgb: 0, 123, 58;
  --ch-primary-dark: #005c2b;
  --ch-accent: #aed581;
}
/* dark mode: same tokens, re-based surfaces — nothing else changes */
[data-bs-theme="dark"] {
  --ch-surface: #16181b;
  --ch-surface-muted: #101214;
  --ch-ink: #e8e6e3;
}
/* Bootstrap consumes the tokens — realm-branded buttons/links for free */
.btn-primary {
  --bs-btn-bg: var(--ch-primary);
  --bs-btn-border-color: var(--ch-primary);
  --bs-btn-hover-bg: var(--ch-primary-dark);
  --bs-btn-hover-border-color: var(--ch-primary-dark);
}
a { color: var(--ch-primary); }
body { background: var(--ch-surface-muted); color: var(--ch-ink); }

/* ---- shared bits ---- */
.env-badge { background: var(--ch-accent); color: #1c1f23; font-weight: 700; }
.proto-page { background: var(--ch-surface); min-height: 60vh; }

/* ============ Variant A — Banner (modernized current) ============ */
.va-banner { background: linear-gradient(120deg, var(--ch-primary-dark), var(--ch-primary)); color: var(--ch-header-fg); }
.va-banner .acronym { font-size: 2rem; font-weight: 800; letter-spacing: .02em; }
.va-banner .site-title { opacity: .92; font-weight: 300; }
.va-nav { background: var(--ch-surface); border-bottom: 3px solid var(--ch-primary); }
.va-nav .nav-link { color: var(--ch-ink); font-weight: 600; }
.va-nav .nav-link:hover { color: var(--ch-primary); }

/* ============ Variant B — App bar (compact, sticky) ============ */
.vb-bar { background: var(--ch-primary); color: var(--ch-header-fg); }
.vb-bar .nav-link { color: rgba(255,255,255,.85); font-weight: 500; }
.vb-bar .nav-link:hover, .vb-bar .nav-link.active { color: #fff; }
.vb-logo { width: 38px; height: 38px; border-radius: 8px; background: #fff; color: var(--ch-primary);
  display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.vb-search input { background: rgba(255,255,255,.15); border: none; color: #fff; }
.vb-search input::placeholder { color: rgba(255,255,255,.6); }
.vb-search input:focus { background: rgba(255,255,255,.25); color: #fff; box-shadow: none; }

/* ============ Variant C — Utility split (neutral + accent) ============ */
.vc-utility { background: var(--ch-ink); color: var(--ch-surface); font-size: .8rem; }
[data-bs-theme="dark"] .vc-utility { background: #000; }
.vc-utility a { color: inherit; opacity: .8; text-decoration: none; }
.vc-utility a:hover { opacity: 1; }
.vc-brand { background: var(--ch-surface); }
.vc-brand .acronym { color: var(--ch-primary); font-weight: 800; font-size: 1.6rem; }
.vc-pills .nav-link { color: var(--ch-ink); font-weight: 600; border-radius: 999px; padding: .35rem 1rem; }
.vc-pills .nav-link.active { background: var(--ch-primary); color: var(--ch-header-fg); }
.vc-pills .nav-link:hover:not(.active) { background: rgba(var(--ch-primary-rgb), .12); }
.vc-search { max-width: 560px; }
.vc-search .form-control { border-color: rgba(var(--ch-primary-rgb), .4); }

/* ---- floating prototype switcher: obviously not part of the design ---- */
.proto-switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: #111; color: #fff; border-radius: 999px; padding: .4rem .6rem; z-index: 1080;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
.proto-switcher button { background: #333; color: #fff; border: none; border-radius: 999px; width: 28px; height: 28px; }
.proto-switcher select, .proto-switcher .toggle { background: #333; color: #fff; border: none; border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, computed } = Vue;

// ——— the realm config that drives ONE header component (mirrors realm-configurations API)
const REALMS = {
  abs: { acronym: 'ABSCH', name: 'Access and Benefit-Sharing Clearing-House', protocol: 'Nagoya Protocol', protocolUrl: 'https://www.cbd.int/abs' },
  bch: { acronym: 'BCH', name: 'Biosafety Clearing-House', protocol: 'Cartagena Protocol', protocolUrl: 'https://www.cbd.int/biosafety' },
  chm: { acronym: 'CHM', name: 'Clearing-House Mechanism', protocol: 'Convention on Biological Diversity', protocolUrl: 'https://www.cbd.int' },
};
const NAV = [
  { label: 'Home', href: '.' },
  { label: 'About', href: 'kb' },
  { label: 'Search', href: 'search', children: ['Records', 'National Reports & Analyzer'] },
  { label: 'Submit', href: 'register' },
  { label: 'Country Profiles', href: 'countries', children: ['Search countries…', 'Overview of all countries'] },
  { label: 'Help', href: 'kb', children: ['Knowledge Base', 'FAQ', 'Training site', 'Contact us'] },
  { label: 'Forums', href: 'forums' },
];

const navProps = { props: ['realm', 'nav'] };

/* ============ Variant A — Banner: modernized version of today's layout ============ */
const VariantA = {
  ...navProps, name: 'Banner',
  template: `
  <div>
    <div class="va-banner px-4 py-3 d-flex align-items-center justify-content-between">
      <div>
        <span class="acronym">{{ realm.acronym }}</span>
        <span class="site-title fs-4 ms-2 d-none d-md-inline">{{ realm.name }}</span>
        <span class="env-badge badge ms-2 align-middle">TRAINING</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a :href="realm.protocolUrl" class="text-white text-decoration-none small d-none d-lg-block" style="opacity:.85">{{ realm.protocol }} <i class="bi bi-box-arrow-up-right"></i></a>
        <button class="btn btn-sm btn-light">Sign in</button>
      </div>
    </div>
    <nav class="va-nav px-3">
      <ul class="nav">
        <li v-for="item in nav" class="nav-item dropdown">
          <a class="nav-link px-3 py-2" :class="{'dropdown-toggle': item.children}" href="#" :data-bs-toggle="item.children ? 'dropdown' : null">{{ item.label }}</a>
          <ul v-if="item.children" class="dropdown-menu">
            <li v-for="c in item.children"><a class="dropdown-item" href="#">{{ c }}</a></li>
          </ul>
        </li>
        <li class="nav-item ms-auto d-none d-md-block">
          <a class="nav-link px-3 py-2"><i class="bi bi-search"></i></a>
        </li>
      </ul>
    </nav>
  </div>`
};

/* ============ Variant B — App bar: one slim sticky row, search inline ============ */
const VariantB = {
  ...navProps, name: 'App bar',
  template: `
  <nav class="vb-bar px-3 py-2 d-flex align-items-center gap-3 sticky-top">
    <div class="d-flex align-items-center gap-2">
      <div class="vb-logo">{{ realm.acronym.slice(0,3) }}</div>
      <div class="d-none d-lg-block lh-1">
        <div class="fw-bold">{{ realm.acronym }}</div>
        <div style="font-size:.7rem; opacity:.75">{{ realm.protocol }}</div>
      </div>
    </div>
    <ul class="nav flex-nowrap">
      <li v-for="item in nav.slice(0,6)" class="nav-item dropdown">
        <a class="nav-link px-2" :class="{'dropdown-toggle': item.children}" href="#" :data-bs-toggle="item.children ? 'dropdown' : null">{{ item.label }}</a>
        <ul v-if="item.children" class="dropdown-menu">
          <li v-for="c in item.children"><a class="dropdown-item" href="#">{{ c }}</a></li>
        </ul>
      </li>
    </ul>
    <div class="vb-search ms-auto d-none d-md-block" style="width: 260px">
      <input class="form-control form-control-sm" placeholder="Search records, help, countries…">
    </div>
    <span class="env-badge badge">TRG</span>
    <button class="btn btn-sm btn-outline-light">Sign in</button>
  </nav>`
};

/* ============ Variant C — Utility split: neutral chrome, accent used sparingly ============ */
const VariantC = {
  ...navProps, name: 'Utility split',
  template: `
  <div>
    <div class="vc-utility px-4 py-1 d-flex justify-content-between">
      <div class="d-flex gap-3">
        <a :href="realm.protocolUrl">{{ realm.protocol }}</a>
        <a href="#">CBD.int</a>
      </div>
      <div class="d-flex gap-3 align-items-center">
        <span class="env-badge badge" style="font-size:.65rem">TRAINING</span>
        <a href="#"><i class="bi bi-globe2"></i> EN</a>
        <a href="#"><i class="bi bi-person-circle"></i> Sign in</a>
      </div>
    </div>
    <div class="vc-brand px-4 pt-3 pb-2 text-center border-bottom">
      <div class="acronym">{{ realm.acronym }} <span class="fw-light" style="color:var(--ch-ink)">· {{ realm.name }}</span></div>
      <div class="vc-search input-group input-group mt-2 mx-auto">
        <input class="form-control" placeholder="Search everything…">
        <button class="btn btn-primary"><i class="bi bi-search"></i></button>
      </div>
      <ul class="nav vc-pills justify-content-center mt-2 pb-1">
        <li v-for="(item, i) in nav" class="nav-item">
          <a class="nav-link" :class="{active: i === 0}" href="#">{{ item.label }}</a>
        </li>
      </ul>
    </div>
  </div>`
};

/* ============ host page: breadcrumb + fake density so variants aren't judged in a vacuum ============ */
const App = {
  components: { VariantA, VariantB, VariantC },
  setup() {
    const variants = ['A', 'B', 'C'];
    const names = { A: 'Banner', B: 'App bar', C: 'Utility split' };
    const params = new URLSearchParams(location.search);
    const variant = ref(variants.includes(params.get('variant')) ? params.get('variant') : 'A');
    const realmKey = ref('abs');
    const dark = ref(false);

    const realm = computed(() => REALMS[realmKey.value]);
    const setVariant = (v) => {
      variant.value = v;
      const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u);
    };
    const cycle = (d) => setVariant(variants[(variants.indexOf(variant.value) + d + 3) % 3]);
    const applyRealm = () => document.documentElement.setAttribute('data-realm', realmKey.value);
    const applyDark = () => document.documentElement.setAttribute('data-bs-theme', dark.value ? 'dark' : 'light');
    applyRealm(); applyDark();

    addEventListener('keydown', (e) => {
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (e.key === 'ArrowLeft') cycle(-1);
      if (e.key === 'ArrowRight') cycle(1);
    });

    return { variants, names, variant, realmKey, dark, realm, cycle, setVariant, applyRealm, applyDark, NAV };
  },
  template: `
  <div>
    <component :is="'Variant' + variant" :realm="realm" :nav="NAV" />

    <div class="proto-page px-4 py-3">
      <nav style="font-size:.85rem" class="mb-3"><a href="#">Home</a> / <a href="#">Search</a> / <span>Absence of national measures</span></nav>
      <div class="row g-3">
        <div class="col-md-8">
          <h4>Search results <span class="badge text-bg-secondary">1,284</span></h4>
          <div v-for="i in 3" class="card mb-2"><div class="card-body py-2">
            <div class="fw-bold" style="color: var(--ch-primary)">IRCC-{{ 250000 + i * 137 }} — Internationally recognized certificate of compliance</div>
            <div class="small opacity-75">Published 2026-0{{i}}-12 · Uruguay · Permit or its equivalent</div>
          </div></div>
          <button class="btn btn-primary btn-sm">Load more</button>
        </div>
        <div class="col-md-4">
          <div class="card"><div class="card-body">
            <h6>Refine by country</h6>
            <input class="form-control form-control-sm mb-2" placeholder="Filter…">
            <div class="small"><div v-for="c in ['Uruguay (214)', 'Kenya (188)', 'Norway (102)']" class="py-1 border-bottom">{{ c }}</div></div>
          </div></div>
        </div>
      </div>
    </div>

    <div class="proto-switcher">
      <button @click="cycle(-1)" aria-label="previous">‹</button>
      <span><strong>{{ variant }}</strong> — {{ names[variant] }}</span>
      <button @click="cycle(1)" aria-label="next">›</button>
      <select v-model="realmKey" @change="applyRealm">
        <option value="abs">ABS</option><option value="bch">BCH</option><option value="chm">CHM</option>
      </select>
      <label class="toggle" style="cursor:pointer"><input type="checkbox" v-model="dark" @change="applyDark" class="form-check-input me-1">dark</label>
    </div>
  </div>`
};

createApp(App).mount('#app');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
