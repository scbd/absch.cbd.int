<div>
    <div ng-repeat="option in question.options">
        <label class="radio-inline">
            <input type="radio" ng-model="answer.value" ng-value="{{$index}}" name="{{question.key}}"  
                ng-disabled="ngDisabledFn()" ng-change="updateAnswer()"/>
            <span ng-bind-html="option.title"></span>
        </label>
    </div>
    <div class="pt-2 ps-4" ng-if="hasAdditionalInformation && binding.value == hasAdditionalInformation.value">
        <div class="km-control-group" name="{{ question.additionalKeyName || 'question' + question.key + '_additionalInformation'}}" required="{{isAdditionalInformationRequired()}}" ng-attr-caption="{{getNumberedCaption()}}">
        <div ng-if="hasAdditionalInformation.footnote" ng-bind-html="hasAdditionalInformation.footnote"  class="small text-muted"></div>
            <div ng-if="hasAdditionalInformation.type == 'lstring'" km-textbox-ml name="{{question.key}}_additionalInformation" ng-model="answer.additionalInformation" locales="locales"
                ng-change="updateAnswer()" ng-disabled="ngDisabledFn()"></div>
            <div ng-if="hasAdditionalInformation.type == 'lstringRte'" km-rich-textbox rows="4" name="{{question.key}}_additionalInformation" ng-model="answer.additionalInformation" locales="locales"
                ng-change="updateAnswer()" ng-disabled="ngDisabledFn()"></div>
        </div>
    </div>

</div>
